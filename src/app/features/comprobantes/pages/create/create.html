<div class="card shadow">
  <div class="card-header bg-success text-white">
    <h5 class="mb-0">
      {{ editando ? 'Editar Comprobante' : 'Nuevo Comprobante' }}
    </h5>
  </div>

  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="guardar()">

      <div class="mb-3">
        <label>Número</label>
        <input
          type="text"
          class="form-control"
          formControlName="numero">
        <small class="text-danger"
               *ngIf="form.controls.numero.touched && form.controls.numero.invalid">
          El número es obligatorio
        </small>
      </div>

      <div class="mb-3">
        <label>Puesto</label>
        <select
          class="form-control"
          formControlName="idPuesto"
          (change)="cambiarPuesto()">
          <option [ngValue]="null">-- Seleccione un puesto --</option>
          <option *ngFor="let p of puestos" [ngValue]="p.id">
            {{ p.codigo }} - {{ p.descripcion }}{{ p.socio ? ' (' + p.socio.nombre + ')' : '' }}
          </option>
        </select>
        <small class="text-danger"
               *ngIf="form.controls.idPuesto.touched && form.controls.idPuesto.invalid">
          El puesto es obligatorio
        </small>
      </div>

      <!-- Deudas a pagar (solo al registrar) -->
      <div class="mb-3" *ngIf="!editando && form.value.idPuesto">
        <label>Deudas pendientes del puesto (pago total)</label>

        <div *ngIf="deudasPendientes.length === 0" class="alert alert-info py-2 mb-0">
          El puesto no tiene deudas pendientes.
        </div>

        <table *ngIf="deudasPendientes.length > 0" class="table table-sm table-bordered mb-0">
          <thead class="table-light">
            <tr>
              <th></th>
              <th>Motivo</th>
              <th>Fecha</th>
              <th class="text-end">Monto</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let d of deudasPendientes">
              <td>
                <input type="checkbox"
                       [checked]="seleccionadas.has(d.id)"
                       (change)="alternarDeuda(d)">
              </td>
              <td>{{ d.motivo?.descripcion }}</td>
              <td>{{ d.fecha }}</td>
              <td class="text-end">S/ {{ d.monto }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="mb-3" *ngIf="editando">
        <label>Fecha</label>
        <input
          type="datetime-local"
          class="form-control"
          formControlName="fecha"
          readonly>
      </div>

      <div class="mb-3">
        <label>Tipo</label>
        <select
          class="form-control"
          formControlName="tipo">
          <option value="BOLETA">BOLETA</option>
          <option value="FACTURA">FACTURA</option>
          <option value="RECIBO">RECIBO</option>
        </select>
      </div>

      <div class="mb-3">
        <label>Total {{ editando ? '' : '(suma de las deudas seleccionadas)' }}</label>
        <input
          type="number"
          class="form-control"
          formControlName="total">
      </div>

      <div class="mb-3">
        <label>Vuelto</label>
        <input
          type="number"
          class="form-control"
          formControlName="vuelto">
      </div>

      <button type="submit" class="btn btn-success me-2">
        Guardar
      </button>

      <button
        type="button"
        class="btn btn-secondary"
        routerLink="/comprobantes">
        Cancelar
      </button>

    </form>
  </div>
</div>
